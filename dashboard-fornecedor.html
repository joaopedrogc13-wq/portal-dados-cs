<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:12px}
header{background:var(--hdr);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:18px;font-weight:700;letter-spacing:.5px}
.subtitle{font-size:11px;opacity:.8;margin-top:2px}
.period-tabs{display:flex;gap:6px}
.ptab{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s}
.ptab.active{background:#fff;color:var(--hdr)}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px 20px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.kpi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:3px}
.kpi-val{font-size:18px;font-weight:700}
.kpi-sub{font-size:10px;color:var(--mu);margin-top:2px}
.controls{display:flex;gap:8px;padding:0 20px 8px;align-items:center;flex-wrap:wrap}
.search-box{padding:6px 10px;border:1px solid var(--bd);border-radius:6px;font-size:11px;width:220px;outline:none}
.search-box:focus{border-color:var(--acc)}
.show-all-btn{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer;font-size:10px;font-weight:600;color:var(--acc)}
.show-all-btn:hover{background:#EFF6FF}
.section-hdr{padding:4px 20px 6px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.tbl-wrap{overflow-x:auto;padding:0 12px 20px}
table{width:100%;border-collapse:collapse;min-width:900px}
thead th{background:var(--hdr);color:#fff;padding:7px 8px;text-align:right;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;position:sticky;top:0;z-index:10}
thead th.col-name{text-align:left;min-width:220px}
thead th.col-rank{text-align:center;width:36px}
tbody tr{transition:.1s}
tbody tr:hover td{background:#F0F7FF!important}
tbody tr td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
tbody tr td.col-name{text-align:left}
tbody tr td.col-rank{text-align:center;color:var(--mu);font-weight:700;font-size:10px}
.mg-pill{display:inline-block;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:700;color:#fff}
.mg-g{background:#1B7F3E}.mg-y{background:#C87A00}.mg-r{background:#C0392B}
.neg{color:var(--rd)}
.part-bar{display:flex;align-items:center;gap:5px}
.part-bg{flex:1;background:#E5E7EB;border-radius:3px;height:8px;min-width:60px}
.part-fg{height:8px;border-radius:3px;background:#2563EB;transition:.3s}
.part-pct{font-size:9px;color:var(--mu);min-width:30px;text-align:right}
tfoot td{font-weight:700;background:#F1F5F9;padding:7px 8px;text-align:right;border-top:2px solid #CBD5E1;font-size:11px;position:sticky;bottom:0}
tfoot td.col-name{text-align:left}
</style>
</head>

let activePeriod = 'fev';
let showAll = false;
const TOP_N = 30;

function fmtR(v){
  if(!v||v===0)return '—';
  const a=Math.abs(v);
  const s=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0);
  return v<0?'('+s+')':s;
}
function fmtP(v){return v==null?'—':v.toFixed(1)+'%';}
function fmtN(v){return !v&&v!==0?'—':Number(v).toLocaleString('pt-BR');}
function fmtPz(v){return !v||v===0?'—':v.toFixed(1)+' d';}
function mgClass(mg){return mg>=10?'mg-g':mg>=5?'mg-y':'mg-r';}

function setPeriod(p){
  activePeriod=p;
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  const labels={jan:'Jan/2026',fev:'Fev/2026',mar:'Mar/2026 (parcial)'};
  document.querySelectorAll('.ptab').forEach(t=>{if(t.textContent.toLowerCase().startsWith(p))t.classList.add('active');});
  document.getElementById('sectionTitle').textContent='Fornecedores — '+labels[p];
  render();
}

function toggleShowAll(){
  showAll=!showAll;
  document.getElementById('showAllBtn').textContent=showAll?'Mostrar top '+TOP_N+' apenas':'Mostrar todos ('+RAW_FORN.length+')';
  render();
}

function render(){
  const p=activePeriod;
  const q=(document.getElementById('searchBox').value||'').toLowerCase().trim();
  const rows=RAW_FORN.filter(r=>!q||r.n.toLowerCase().includes(q)||String(r.c).includes(q));

  let tvb=0,tdev=0,tvl=0,tcmv=0,tlu=0,tbon=0,tnfs=0;
  rows.forEach(r=>{const d=r[p];tvb+=d.vb;tdev+=d.dev;tvl+=d.vl;tcmv+=d.cmv-d.cmv_dev;tlu+=d.lucro;tbon+=d.bon;tnfs+=d.nfs;});
  const tmg=tvl>0?tlu/tvl*100:0;

  const kpis=[
    {label:'Fat.Bruto',val:tvb,color:'#1E3A5F'},
    {label:'Devoluções',val:tdev,color:'#C0392B'},
    {label:'Fat.Líquido',val:tvl,color:'#1565C0'},
    {label:'Lucro',val:tlu,color:tlu>=0?'#1B7F3E':'#C0392B'},
    {label:'Margem',val:tmg,pct:true,color:tmg>=10?'#1B7F3E':tmg>=5?'#C87A00':'#C0392B'},
    {label:'Bonificação',val:tbon,color:'#7B1FA2'},
    {label:'NFs (período)',val:tnfs,int:true,color:'#455A64'},
  ];
  document.getElementById('kpiBar').innerHTML=kpis.map(k=>{
    let disp;
    if(k.pct) disp=k.val.toFixed(1)+'%';
    else if(k.int) disp=Number(k.val).toLocaleString('pt-BR');
    else{const a=Math.abs(k.val);const s=a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0);disp=(k.val<0?'('+s+')':s);}
    return '<div class="kpi"><div class="kpi-label">'+k.label+'</div><div class="kpi-val" style="color:'+k.color+'">'+disp+'</div></div>';
  }).join('');

  const visible=showAll?rows:rows.slice(0,TOP_N);
  document.getElementById('rowCountLabel').textContent=
    (q?'Filtrado: '+rows.length+' de '+RAW_FORN.length+' · ':'')+
    (!showAll&&rows.length>TOP_N?'Exibindo top '+TOP_N+' de '+rows.length:'');

  let html='';
  visible.forEach((r,idx)=>{
    const d=r[p];
    const mg=d.vl>0?d.lucro/d.vl*100:0;
    const part=tvb>0?d.vb/tvb*100:0;
    html+='<tr>'
      +'<td class="col-rank">'+(idx+1)+'</td>'
      +'<td class="col-name"><strong>'+r.n+'</strong><span style="font-size:9px;color:#9CA3AF;margin-left:4px">#'+r.c+'</span></td>'
      +'<td>'+fmtR(d.vb)+'</td>'
      +'<td>'+(d.dev>0?'<span class="neg">('+fmtR(d.dev)+')</span>':'—')+'</td>'
      +'<td>'+fmtR(d.vl)+'</td>'
      +'<td>'+fmtR(d.cmv-d.cmv_dev)+'</td>'
      +'<td class="'+(d.lucro<0?'neg':'')+'">'+fmtR(d.lucro)+'</td>'
      +'<td><span class="mg-pill '+mgClass(mg)+'">'+fmtP(mg)+'</span></td>'
      +'<td>'+(d.bon>0?fmtR(d.bon):'—')+'</td>'
      +'<td>'+fmtN(d.nfs)+'</td>'
      +'<td>'+fmtPz(d.prazo)+'</td>'
      +'<td><div class="part-bar"><div class="part-bg"><div class="part-fg" style="width:'+Math.min(part,100).toFixed(2)+'%"></div></div><span class="part-pct">'+part.toFixed(1)+'%</span></div></td>'
      +'</tr>';
  });
  document.getElementById('tbody').innerHTML=html;

  document.getElementById('tfoot').innerHTML='<tr>'
    +'<td></td>'
    +'<td class="col-name">TOTAL ('+rows.length+' fornecedores)</td>'
    +'<td>'+fmtR(tvb)+'</td>'
    +'<td>'+(tdev>0?'<span class="neg">('+fmtR(tdev)+')</span>':'—')+'</td>'
    +'<td>'+fmtR(tvl)+'</td>'
    +'<td>'+fmtR(tcmv)+'</td>'
    +'<td class="'+(tlu<0?'neg':'')+'">'+fmtR(tlu)+'</td>'
    +'<td><span class="mg-pill '+mgClass(tmg)+'">'+fmtP(tmg)+'</span></td>'
    +'<td>'+fmtR(tbon)+'</td>'
    +'<td>'+fmtN(tnfs)+'</td>'
    +'<td>—</td>'
    +'<td>100%</td>'
    +'</tr>';
}

render();
</script>
